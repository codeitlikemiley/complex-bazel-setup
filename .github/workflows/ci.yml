name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # This repo is dual-buildable, so both build systems are gated. There is no
  # root Cargo.toml -- corex/, server/ and combos/ are three separate Cargo
  # workspaces -- so cargo runs once per directory.
  cargo:
    name: cargo (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [corex, server, combos]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml, which pins the same version as
      # rust.toolchain() in MODULE.bazel and lists rustfmt + clippy.
      - name: Show toolchain
        run: rustc --version && cargo --version && cargo clippy --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ matrix.dir }}/target
          key: cargo-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.dir)) }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.dir }}-

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --workspace --locked -- -D warnings

      - name: build
        run: cargo build --all-targets --locked

      - name: test
        run: cargo test --all-targets --locked

      # Only corex has a [lib] today, and `cargo test --doc` hard-errors with
      # "no library targets found" in the other two. Skip where there is none
      # rather than letting the matrix be permanently red in 2 of 3 cells.
      - name: doc tests
        run: |
          if cargo metadata --no-deps --format-version=1 \
             | jq -e '[.packages[].targets[] | select(.kind[] == "lib")] | length > 0' >/dev/null; then
            cargo test --doc --locked
          else
            echo "no lib target in ${{ matrix.dir }}; skipping doc tests"
          fi

  bazel:
    name: bazel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bazelisk ships on the GitHub ubuntu runners and honours .bazelversion.
      - name: Show Bazel version
        run: bazel --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', '**/Cargo.lock') }}
          restore-keys: bazel-${{ runner.os }}-

      # --config=locked sets --lockfile_mode=error, which fails the build if
      # MODULE.bazel.lock is stale rather than silently re-resolving. It is
      # applied only when the lock exists so that the very first run -- the one
      # where the `lockfile` job below creates it -- is not red. Once the lock is
      # committed this is always on.
      - name: Enable strict lockfile checking if the lock exists
        id: locked
        run: |
          if [ -f MODULE.bazel.lock ]; then
            echo "flag=--config=locked" >> "$GITHUB_OUTPUT"
            echo "MODULE.bazel.lock present: verifying with --lockfile_mode=error"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "::warning::MODULE.bazel.lock not committed yet; the lockfile job will create it."
          fi

      - name: build
        run: bazel build --config=ci ${{ steps.locked.outputs.flag }} //...

      - name: test
        run: bazel test --config=ci ${{ steps.locked.outputs.flag }} //...

      # rustfmt + clippy as aspects over the whole graph, with -D warnings.
      - name: lint
        run: bazel build --config=ci ${{ steps.locked.outputs.flag }} --config=lint //...

  # MODULE.bazel.lock is a generated artifact that has to track MODULE.bazel, and
  # regenerating it needs network access to bcr.bazel.build. Rather than relying
  # on every contributor to remember, CI owns it: this job regenerates the lock
  # and commits it whenever it drifts. On every run after that it is a no-op, so
  # it doubles as the drift detector.
  lockfile:
    name: MODULE.bazel.lock
    runs-on: ubuntu-latest
    # Pull requests from forks get a read-only token, so there is nothing to push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch itself rather than the detached PR merge commit,
          # so the push below has a branch to land on.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-lock-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', '**/Cargo.lock') }}
          restore-keys: bazel-lock-${{ runner.os }}-

      # Resolves the module graph and writes MODULE.bazel.lock, including the
      # registryFileHashes that pin what bcr.bazel.build served.
      - name: Resolve modules
        run: bazel mod deps --lockfile_mode=update

      - name: Commit the lockfile if it changed
        run: |
          if [ -z "$(git status --porcelain -- MODULE.bazel.lock)" ]; then
            echo "MODULE.bazel.lock is up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULE.bazel.lock
          git commit -m "chore: update MODULE.bazel.lock" \
                     -m "Regenerated by CI from MODULE.bazel. Pins the resolved module graph and the registry file hashes that bcr.bazel.build served; --config=locked verifies it."
          git push
          echo "::notice::MODULE.bazel.lock was regenerated and committed."
