name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # This repo is dual-buildable, so both build systems are gated. There is no
  # root Cargo.toml -- corex/, server/ and combos/ are three separate Cargo
  # workspaces -- so cargo runs once per directory.
  # One Cargo workspace at the repo root covers all four crates, so cargo runs
  # once. (It used to run three times: corex/, server/ and combos/ were separate
  # workspaces with separate lockfiles.)
  cargo:
    name: cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml, which pins the same version as
      # rust.toolchain() in MODULE.bazel and lists rustfmt + clippy.
      - name: Show toolchain
        run: rustc --version && cargo --version && cargo clippy --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets --locked

      - name: test
        run: cargo test --workspace --all-targets --locked

      # --workspace --doc only runs doctests for members that have a lib target,
      # so the "no library targets found" error that made this conditional
      # before no longer applies.
      - name: doc tests
        run: cargo test --workspace --doc --locked

  bazel:
    name: bazel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bazelisk ships on the GitHub ubuntu runners and honours .bazelversion.
      - name: Show Bazel version
        run: bazel --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', '**/Cargo.lock') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: build
        run: bazel build --config=ci //...

      - name: test
        run: bazel test --config=ci //...

      # rustfmt + clippy as aspects over the whole graph, with -D warnings.
      - name: lint
        run: bazel build --config=ci --config=lint //...
