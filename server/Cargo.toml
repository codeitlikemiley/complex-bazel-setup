[package]
name = "server"
version = "0.1.0"
edition = "2024"
# Matches the pin in rust-toolchain.toml and MODULE.bazel.
rust-version = "1.94"

[dependencies]
axum = "0.8.4"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "fibonacci_benchmark"
harness = false
